<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>matro-dashboard · Code Map</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#12161f; --panel-2:#171c28; --line:#242c3d;
    --ink:#e7ecf7; --ink-soft:#8892a8; --ink-dim:#525c72;
    --c-ci:#f5c842; --c-script:#5b8dee; --c-ui:#ff8c42; --c-data:#3ecf8e; --c-external:#9b6dff;
    --hi:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);height:100%}
  body{font-family:'Segoe UI',-apple-system,system-ui,sans-serif;color:var(--ink);overflow:hidden}

  .topbar{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--panel);
    border-bottom:1px solid var(--line);position:relative;z-index:5}
  .topbar h1{font-size:14px;font-weight:700}
  .topbar .meta{font-size:11.5px;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap}
  .topbar .meta b{color:var(--ink-dim);font-weight:600}
  .topbar .spacer{flex:1}
  .search{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;padding:5px 10px}
  .search input{background:none;border:none;color:var(--ink);font-size:12.5px;outline:none;width:170px}
  .search input::placeholder{color:var(--ink-dim)}

  .layout{display:flex;height:calc(100% - 45px)}
  .side{width:260px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;padding:14px}
  .side h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-dim);
    margin:16px 0 8px;font-weight:700}
  .side h3:first-child{margin-top:0}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 6px;border-radius:6px;
    cursor:pointer;color:var(--ink-soft);transition:background .15s}
  .legend-item:hover{background:var(--panel-2)}
  .legend-item.off{opacity:.35}
  .swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .flow-item{font-size:12px;padding:8px 9px;border-radius:8px;cursor:pointer;margin-bottom:6px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink-soft);line-height:1.4;
    transition:all .15s}
  .flow-item:hover{border-color:var(--ink-dim);color:var(--ink)}
  .flow-item.active{border-color:var(--hi);color:var(--ink);background:#1c2233}
  .flow-item .fnum{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
    border-radius:50%;background:var(--panel);font-size:9.5px;font-weight:700;margin-right:6px}
  .clear-btn{font-size:11px;color:var(--ink-dim);cursor:pointer;text-decoration:underline;margin-top:6px;display:inline-block}
  .clear-btn:hover{color:var(--ink)}

  .canvas-wrap{flex:1;position:relative;overflow:hidden;cursor:grab}
  .canvas-wrap.dragging{cursor:grabbing}
  svg#graph{width:100%;height:100%;display:block}

  .node-box{fill:var(--panel-2);stroke:var(--line);stroke-width:1.5;rx:12;cursor:pointer;transition:stroke .15s, filter .15s}
  .node-box:hover{stroke:var(--ink-dim)}
  .node-label{fill:var(--ink);font-size:12px;font-weight:600;pointer-events:none}
  .node-sub{fill:var(--ink-dim);font-size:9.5px;pointer-events:none}
  .node-dot{pointer-events:none}
  .edge-line{stroke:var(--ink-dim);stroke-width:1.4;fill:none;opacity:.55;transition:all .15s}
  .edge-label{fill:var(--ink-dim);font-size:8.5px;pointer-events:none;opacity:0;transition:opacity .15s}

  .dim{opacity:.15}
  .hi-node .node-box{stroke:var(--hi);stroke-width:2.2;filter:drop-shadow(0 0 8px rgba(255,255,255,.25))}
  .hi-edge{opacity:1 !important;stroke-width:2.2 !important}
  .hi-edge .edge-label{opacity:1}
  .flow-hi .node-box{stroke:#ffd166;stroke-width:2.4;filter:drop-shadow(0 0 10px rgba(255,209,102,.4))}
  .flow-hi-edge{stroke:#ffd166 !important;opacity:1 !important;stroke-width:2.6 !important}

  .detail{position:absolute;top:14px;right:14px;width:320px;max-height:calc(100% - 28px);overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;font-size:12.5px;z-index:6}
  .detail.show{display:block}
  .detail .close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--ink-dim);font-size:16px}
  .detail h2{font-size:15px;margin-bottom:4px;padding-right:20px}
  .detail .path{font-size:11px;color:var(--ink-soft);font-family:monospace;margin-bottom:10px;word-break:break-all}
  .detail .role{color:var(--ink-soft);line-height:1.55;margin-bottom:12px}
  .detail h4{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-dim);margin:12px 0 5px}
  .detail ul{padding-left:16px;color:var(--ink-soft);line-height:1.55}
  .detail li{margin-bottom:3px}
  .detail .rel-list{display:flex;flex-direction:column;gap:5px}
  .detail .rel-item{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;
    font-size:11.5px;cursor:pointer;color:var(--ink-soft)}
  .detail .rel-item:hover{color:var(--ink);border-color:var(--ink-dim)}
  .empty-note{color:var(--ink-dim);font-style:italic;font-size:11.5px}

  .copy-box{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:12px}
  .copy-box-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;
    font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-dim);font-weight:700}
  .copy-btn{font-size:11px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:4px 10px;cursor:pointer;transition:all .15s}
  .copy-btn:hover{border-color:var(--ink-dim)}
  .copy-btn.copied{color:var(--c-data);border-color:var(--c-data)}
  #copy-text{width:100%;height:110px;resize:vertical;background:var(--panel);border:1px solid var(--line);
    border-radius:7px;color:var(--ink-soft);font-family:monospace;font-size:11px;line-height:1.5;
    padding:8px;outline:none}

  .zoom-controls{position:absolute;bottom:16px;left:16px;display:flex;flex-direction:column;gap:4px;z-index:6}
  .zoom-btn{width:30px;height:30px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
    color:var(--ink-soft);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .zoom-btn:hover{color:var(--ink);border-color:var(--ink-dim)}
</style>
</head>

<script>
const CM = JSON.parse(document.getElementById('codemap-data').textContent);

document.getElementById('repo-name').textContent = 'matro-dashboard';
document.getElementById('gen-at').textContent = CM.generated_at;
document.getElementById('gen-commit').textContent = CM.generated_from_commit.slice(0,10);

const TYPE_COLOR = {ci:'var(--c-ci)', script:'var(--c-script)', ui:'var(--c-ui)', data:'var(--c-data)', external:'var(--c-external)'};
const TYPE_LABEL = {ci:'CI / Workflow', script:'Script (Python)', ui:'UI (browser page)', data:'Data artifact', external:'External dependency'};

// ── manual layered layout: minimizes crossings for this pipeline-shaped graph ──
const POS = {
  'meta-api':        {x:70,  y:150},
  'gsc-api':         {x:70,  y:355},
  'update-workflow': {x:330, y:40},
  'fetch-meta':      {x:330, y:150},
  'fetch-gsc':       {x:330, y:355},
  'data-json':       {x:590, y:150},
  'seo-data-json':   {x:590, y:355},
  'index-html':      {x:850, y:80},
  'home-html':       {x:850, y:255},
  'seo-html':        {x:850, y:430},
  'ai-worker':       {x:1100,y:80},
  'cdn-assets':      {x:1100,y:255},
  'github-pages':    {x:1100,y:430},
};
const NODE_W=170, NODE_H=54;

const svg = document.getElementById('graph');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){ const e=document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }

const gRoot = el('g', {id:'root-g'});
svg.appendChild(gRoot);
const gEdges = el('g', {id:'edges'});
const gNodes = el('g', {id:'nodes'});
gRoot.appendChild(gEdges);
gRoot.appendChild(gNodes);

function anchorFor(fromId, toId){
  const a=POS[fromId], b=POS[toId];
  const ax = a.x < b.x ? a.x+NODE_W : (a.x>b.x ? a.x : a.x+NODE_W/2);
  const ay = a.y+NODE_H/2;
  const bx = a.x < b.x ? b.x : (a.x>b.x ? b.x+NODE_W : b.x+NODE_W/2);
  const by = b.y+NODE_H/2;
  return {ax,ay,bx,by};
}

// arrow marker
const defs = el('defs', {});
const marker = el('marker', {id:'arrow', viewBox:'0 0 10 10', refX:'9', refY:'5', markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse'});
const arrowPath = el('path', {d:'M0,0 L10,5 L0,10 z', fill:'var(--ink-dim)'});
marker.appendChild(arrowPath);
defs.appendChild(marker);
svg.appendChild(defs);

const edgeEls = [];
CM.edges.forEach((e, i)=>{
  const {ax,ay,bx,by} = anchorFor(e.from, e.to);
  const midx=(ax+bx)/2;
  const d = `M${ax},${ay} C${midx},${ay} ${midx},${by} ${bx},${by}`;
  const path = el('path', {d, class:'edge-line', 'marker-end':'url(#arrow)', 'data-from':e.from, 'data-to':e.to, 'data-type':e.type});
  gEdges.appendChild(path);
  const lx=(ax+bx)/2, ly=(ay+by)/2;
  const label = el('text', {x:lx, y:ly-4, class:'edge-label', 'text-anchor':'middle'});
  label.textContent = e.type;
  gEdges.appendChild(label);
  edgeEls.push({e, path, label});
});

const nodeEls = {};
CM.nodes.forEach(n=>{
  const p = POS[n.id]; if(!p) return;
  const g = el('g', {class:'node-g', 'data-id':n.id, transform:`translate(${p.x},${p.y})`});
  const box = el('rect', {class:'node-box', width:NODE_W, height:NODE_H, rx:12});
  const dot = el('circle', {class:'node-dot', cx:14, cy:16, r:5, fill:TYPE_COLOR[n.type]||'#888'});
  const label = el('text', {class:'node-label', x:26, y:21});
  label.textContent = n.id;
  const sub = el('text', {class:'node-sub', x:14, y:40});
  sub.textContent = n.path.length>30 ? n.path.slice(0,28)+'…' : n.path;
  g.appendChild(box); g.appendChild(dot); g.appendChild(label); g.appendChild(sub);
  gNodes.appendChild(g);
  nodeEls[n.id] = g;
  g.addEventListener('click', (ev)=>{ ev.stopPropagation(); selectNode(n.id); });
});

// ── legend ──
const legendEl = document.getElementById('legend');
const hiddenTypes = new Set();
Object.keys(TYPE_LABEL).forEach(t=>{
  const item = document.createElement('div');
  item.className='legend-item';
  item.innerHTML = `<span class="swatch" style="background:${TYPE_COLOR[t]}"></span>${TYPE_LABEL[t]}`;
  item.addEventListener('click', ()=>{
    if(hiddenTypes.has(t)){ hiddenTypes.delete(t); item.classList.remove('off'); }
    else { hiddenTypes.add(t); item.classList.add('off'); }
    applyTypeFilter();
  });
  legendEl.appendChild(item);
});
function applyTypeFilter(){
  CM.nodes.forEach(n=>{
    const g = nodeEls[n.id]; if(!g) return;
    g.style.display = hiddenTypes.has(n.type) ? 'none' : '';
  });
  edgeEls.forEach(({e,path,label})=>{
    const fromN = CM.nodes.find(n=>n.id===e.from), toN = CM.nodes.find(n=>n.id===e.to);
    const hide = hiddenTypes.has(fromN.type) || hiddenTypes.has(toN.type);
    path.style.display = hide ? 'none' : '';
    label.style.display = hide ? 'none' : '';
  });
}

// ── flows ──
const flowListEl = document.getElementById('flow-list');
let activeFlow = null;
CM.flows.forEach((f, idx)=>{
  const item = document.createElement('div');
  item.className='flow-item';
  item.innerHTML = `<span class="fnum">${idx+1}</span>${f.trigger}`;
  item.addEventListener('click', ()=>{
    document.querySelectorAll('.flow-item').forEach(x=>x.classList.remove('active'));
    item.classList.add('active');
    highlightFlow(f);
  });
  flowListEl.appendChild(item);
});
document.getElementById('clear-flow').addEventListener('click', ()=>{
  document.querySelectorAll('.flow-item').forEach(x=>x.classList.remove('active'));
  clearHighlights();
});

function clearHighlights(){
  activeFlow=null;
  Object.values(nodeEls).forEach(g=>g.classList.remove('hi-node','flow-hi','dim'));
  edgeEls.forEach(({path,label})=>{ path.classList.remove('hi-edge','flow-hi-edge'); path.classList.remove('dim'); });
}

function highlightFlow(f){
  clearHighlights();
  activeFlow = f;
  const stepSet = new Set(f.steps);
  Object.entries(nodeEls).forEach(([id,g])=>{
    if(stepSet.has(id)) g.classList.add('flow-hi'); else g.classList.add('dim');
  });
  edgeEls.forEach(({e,path})=>{
    const consecutive = f.steps.some((s,i)=> i<f.steps.length-1 && s===e.from && f.steps[i+1]===e.to);
    if(consecutive){ path.classList.add('flow-hi-edge'); } else { path.classList.add('dim'); }
  });
}

// ── node selection: highlight upstream/downstream + detail panel ──
let selectedId = null;
function selectNode(id){
  selectedId = id;
  document.querySelectorAll('.flow-item').forEach(x=>x.classList.remove('active'));
  clearHighlights();
  const upstream = CM.edges.filter(e=>e.to===id).map(e=>e.from);
  const downstream = CM.edges.filter(e=>e.from===id).map(e=>e.to);
  const related = new Set([id, ...upstream, ...downstream]);
  Object.entries(nodeEls).forEach(([nid,g])=>{
    if(related.has(nid)){ g.classList.add(nid===id?'hi-node':'hi-node'); } else { g.classList.add('dim'); }
  });
  edgeEls.forEach(({e,path})=>{
    if(e.from===id || e.to===id){ path.classList.add('hi-edge'); } else { path.classList.add('dim'); }
  });
  showDetail(id, upstream, downstream);
}

function nodeById(id){ return CM.nodes.find(n=>n.id===id); }

function showDetail(id, upstream, downstream){
  const n = nodeById(id);
  const panel = document.getElementById('detail');
  panel.classList.add('show');
  document.getElementById('d-name').textContent = n.id;
  document.getElementById('d-path').textContent = n.path;

  document.getElementById('copy-text').value = buildCopyText(n, upstream, downstream);

  document.getElementById('d-role').textContent = n.role;

  const consEl = document.getElementById('d-constraints');
  consEl.innerHTML = n.constraints.length ? `<h4>Constraints</h4><ul>${n.constraints.map(c=>`<li>${escapeHtml(c)}</li>`).join('')}</ul>` : '';

  const upEl = document.getElementById('d-upstream');
  upEl.innerHTML = '';
  if(!upstream.length) upEl.innerHTML = '<span class="empty-note">none</span>';
  upstream.forEach(uid=>{
    const d = document.createElement('div'); d.className='rel-item'; d.textContent = uid;
    d.addEventListener('click', (ev)=>{ev.stopPropagation(); selectNode(uid);});
    upEl.appendChild(d);
  });

  const dnEl = document.getElementById('d-downstream');
  dnEl.innerHTML = '';
  if(!downstream.length) dnEl.innerHTML = '<span class="empty-note">none</span>';
  downstream.forEach(did=>{
    const d = document.createElement('div'); d.className='rel-item'; d.textContent = did;
    d.addEventListener('click', (ev)=>{ev.stopPropagation(); selectNode(did);});
    dnEl.appendChild(d);
  });

  const flEl = document.getElementById('d-flows');
  flEl.innerHTML = '';
  const relatedFlows = CM.flows.filter(f=>f.steps.includes(id));
  if(!relatedFlows.length) flEl.innerHTML = '<span class="empty-note">none</span>';
  relatedFlows.forEach(f=>{
    const d = document.createElement('div'); d.className='rel-item'; d.textContent = f.trigger;
    d.addEventListener('click', (ev)=>{ev.stopPropagation(); highlightFlow(f);});
    flEl.appendChild(d);
  });

  const evEl = document.getElementById('d-evidence');
  evEl.innerHTML = n.evidence.map(x=>`<li>${escapeHtml(x)}</li>`).join('') || '<li class="empty-note">none</li>';
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function buildCopyText(n, upstream, downstream){
  const relatedFlows = CM.flows.filter(f=>f.steps.includes(n.id));
  const lines = [];
  lines.push(`Модуль: ${n.id} (${n.path})`);
  lines.push(`Роль: ${n.role}`);
  if(n.entrypoints && n.entrypoints.length) lines.push(`Точки входа: ${n.entrypoints.join('; ')}`);
  if(n.constraints && n.constraints.length){
    lines.push('Ограничения / особенности:');
    n.constraints.forEach(c=>lines.push(`  - ${c}`));
  }
  lines.push(`Вызывается из (upstream): ${upstream.length ? upstream.join(', ') : 'нет'}`);
  lines.push(`Зависит от (downstream): ${downstream.length ? downstream.join(', ') : 'нет'}`);
  if(relatedFlows.length){
    lines.push('Сценарии, где участвует:');
    relatedFlows.forEach(f=>lines.push(`  - ${f.trigger} → ${f.outcome}`));
  }
  if(n.evidence && n.evidence.length){
    lines.push('Где именно в коде (evidence):');
    n.evidence.forEach(e=>lines.push(`  - ${e}`));
  }
  return lines.join('\n');
}

document.getElementById('copy-btn').addEventListener('click', async (ev)=>{
  ev.stopPropagation();
  const ta = document.getElementById('copy-text');
  ta.select();
  const btn = document.getElementById('copy-btn');
  try{
    await navigator.clipboard.writeText(ta.value);
  }catch(e){
    document.execCommand('copy');
  }
  btn.textContent = 'Скопировано ✓';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent='Копировать'; btn.classList.remove('copied'); }, 1600);
});

document.getElementById('detail').addEventListener('click', (ev)=>{ ev.stopPropagation(); });

document.getElementById('detail-close').addEventListener('click', ()=>{
  document.getElementById('detail').classList.remove('show');
  clearHighlights();
  selectedId=null;
});
document.getElementById('canvas-wrap').addEventListener('click', ()=>{
  document.getElementById('detail').classList.remove('show');
  clearHighlights();
  selectedId=null;
  document.querySelectorAll('.flow-item').forEach(x=>x.classList.remove('active'));
});

// ── search ──
document.getElementById('search-input').addEventListener('input', (ev)=>{
  const q = ev.target.value.trim().toLowerCase();
  if(!q){ Object.values(nodeEls).forEach(g=>{ g.classList.remove('dim'); }); edgeEls.forEach(({path})=>path.classList.remove('dim')); return; }
  const matched = new Set(CM.nodes.filter(n=> n.id.toLowerCase().includes(q) || n.path.toLowerCase().includes(q) || n.role.toLowerCase().includes(q)).map(n=>n.id));
  Object.entries(nodeEls).forEach(([id,g])=>{ g.classList.toggle('dim', !matched.has(id)); });
  edgeEls.forEach(({e,path})=>{ path.classList.toggle('dim', !(matched.has(e.from)&&matched.has(e.to))); });
});

// ── zoom / pan ──
let viewBox = {x:0,y:0,w:1180,h:520};
svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
function applyVB(){ svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`); }
function zoom(factor){
  const cx = viewBox.x + viewBox.w/2, cy = viewBox.y + viewBox.h/2;
  viewBox.w *= factor; viewBox.h *= factor;
  viewBox.w = Math.max(300, Math.min(3200, viewBox.w));
  viewBox.h = Math.max(140, Math.min(1500, viewBox.h));
  viewBox.x = cx - viewBox.w/2; viewBox.y = cy - viewBox.h/2;
  applyVB();
}
document.getElementById('zoom-in').addEventListener('click', ()=>zoom(0.85));
document.getElementById('zoom-out').addEventListener('click', ()=>zoom(1.18));
document.getElementById('zoom-reset').addEventListener('click', ()=>{ viewBox={x:0,y:0,w:1180,h:520}; applyVB(); });

const wrap = document.getElementById('canvas-wrap');
wrap.addEventListener('wheel', (ev)=>{ ev.preventDefault(); zoom(ev.deltaY>0?1.08:0.93); }, {passive:false});

let dragging=false, dragStart=null, vbStart=null;
wrap.addEventListener('mousedown', (ev)=>{
  if(ev.target.closest('.node-g') || ev.target.closest('.detail')) return;
  dragging=true; wrap.classList.add('dragging');
  dragStart={x:ev.clientX,y:ev.clientY}; vbStart={...viewBox};
});
window.addEventListener('mousemove', (ev)=>{
  if(!dragging) return;
  const rect = wrap.getBoundingClientRect();
  const dx = (ev.clientX-dragStart.x) * (viewBox.w/rect.width);
  const dy = (ev.clientY-dragStart.y) * (viewBox.h/rect.height);
  viewBox.x = vbStart.x - dx; viewBox.y = vbStart.y - dy;
  applyVB();
});
window.addEventListener('mouseup', ()=>{ dragging=false; wrap.classList.remove('dragging'); });
</script>
