name: Update Dashboard Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-auth google-auth-httplib2 google-api-python-client

      - name: Run Meta Ads fetch
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCESS_TOKEN_MATRO: ${{ secrets.META_ACCESS_TOKEN_MATRO }}
          META_ACCOUNT_ID: ${{ secrets.META_ACCOUNT_ID }}
          META_ACCOUNT_ID_2: ${{ secrets.META_ACCOUNT_ID_2 }}
        run: python fetch_meta.py

      - name: Run GSC fetch
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python fetch_gsc.py

      - name: Run Bitrix fetch
        continue-on-error: true
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: python fetch_bitrix.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json 2>/dev/null || true
          git add data2.json 2>/dev/null || true
          git add images/ 2>/dev/null || true
          git add seo_data.json 2>/dev/null || true
          git add bitrix_data.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update dashboard data $(date +'%Y-%m-%d')"
          git push
