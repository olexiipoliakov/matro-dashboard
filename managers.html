<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matro · Менеджери</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>

  :root{
    --bg:#070B14; --card:#101522; --card-hover:#151B2B;
    --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.14);
    --line:rgba(255,255,255,.06);
    --ink:#F7F8FB; --ink-soft:#95A0BF; --ink-dim:#5A6A8A;
    --accent:#9B7FE8; --accent-2:#7D5FD6;
    --seo:#32D8FF; --audit:#5EE7B0;
    --success:#27E37A; --warning:#FFC84D; --danger:#FF5E6C;
    --good:#27E37A; --good-bg:rgba(39,227,122,.12);
    --mid:#FFC84D;  --mid-bg:rgba(255,200,77,.12);
    --bad:#FF5E6C;  --bad-bg:rgba(255,94,108,.12);
    --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;min-width:0}
  html,body{background:var(--bg);overflow-x:hidden}
  body{font-family:'Inter',-apple-system,system-ui,sans-serif;color:var(--ink);
    line-height:1.5;min-height:100vh;position:relative}
  img,svg,table{max-width:100%}

  /* ── фон ── */
  .bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg-fx .glow-1{position:absolute;top:-20%;left:10%;width:60vw;height:60vw;
    background:radial-gradient(circle,rgba(155,127,232,.10),transparent 65%);filter:blur(40px)}
  .bg-fx .glow-2{position:absolute;top:-10%;right:-10%;width:50vw;height:50vw;
    background:radial-gradient(circle,rgba(90,120,255,.12),transparent 65%);filter:blur(40px)}
  .bg-fx .glow-3{position:absolute;bottom:-30%;left:20%;width:70vw;height:50vw;
    background:radial-gradient(circle,rgba(125,95,214,.09),transparent 70%);filter:blur(50px)}
  .bg-fx .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse at 50% 0%,black 0%,transparent 70%)}
  .bg-fx .horizon{position:absolute;top:280px;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(155,127,232,.35),rgba(90,150,255,.25),transparent)}

  /* ── сайдбар ── */
  .layout{display:flex;position:relative;z-index:1}
  .sidebar{width:72px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;
    gap:10px;padding:22px 0;position:sticky;top:0;height:100vh}
  .sidebar .sb-logo{font-size:16px;font-weight:700;color:#FF8C42;margin-bottom:12px}
  .sidebar a{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);text-decoration:none;background:rgba(255,255,255,.02);
    border:1px solid var(--border);position:relative;
    transition:all 200ms cubic-bezier(.2,.8,.2,1)}
  .sidebar a i{width:19px;height:19px}
  .sidebar a:hover{color:var(--ink);background:rgba(155,127,232,.14);border-color:rgba(155,127,232,.3);
    transform:translateY(-2px)}
  .sidebar a.active{color:var(--accent);background:rgba(155,127,232,.16);border-color:rgba(155,127,232,.35)}
  .sidebar a .tip{position:absolute;left:56px;top:50%;transform:translateY(-50%) translateX(-4px);
    background:#1a2033;color:var(--ink);font-size:12px;font-weight:500;white-space:nowrap;
    padding:6px 10px;border-radius:8px;border:1px solid var(--border-strong);
    opacity:0;pointer-events:none;transition:opacity 180ms ease, transform 180ms ease;z-index:20}
  .sidebar a:hover .tip{opacity:1;transform:translateY(-50%) translateX(0)}
  @media(max-width:760px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;height:100vh;background:rgba(7,11,20,.9);
      backdrop-filter:blur(12px);border-right:1px solid var(--border);z-index:10}
    .layout{padding-left:72px}
  }

  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;flex:1;min-width:0;
    padding:40px clamp(20px,5vw,64px) 64px}

  /* ── шапка ── */
  header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:26px}
  .home-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);
    text-decoration:none;margin-bottom:14px;transition:color 180ms ease}
  .home-link:hover{color:var(--ink)}
  .home-link i{width:14px;height:14px}
  .page-title{font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.5px;
    display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .page-title .ti{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:rgba(155,127,232,.14);color:var(--accent);flex-shrink:0}
  .page-title .ti i{width:21px;height:21px}
  .sub{font-size:14px;color:var(--ink-soft)}
  .meta-line{text-align:right;font-size:12.5px;color:var(--ink-dim);line-height:1.7;
    background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:11px 16px}
  .meta-line b{color:var(--ink-soft);font-weight:600}

  /* ── период ── */
  .period-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .period-btns{display:flex;gap:8px;flex-wrap:wrap}
  .pbtn{padding:9px 16px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;
    border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--ink-soft);
    border-radius:11px;transition:all 180ms ease;white-space:nowrap}
  .pbtn:hover{color:var(--ink);border-color:var(--border-strong)}
  .pbtn.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
  .period-cal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-dim)}
  .period-cal input[type=date]{font-family:inherit;font-size:12.5px;color:var(--ink);padding:8px 10px;
    border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.03);max-width:160px;
    color-scheme:dark;outline:none;transition:border-color 180ms ease}
  .period-cal input[type=date]:focus{border-color:rgba(155,127,232,.4)}
  .period-info{font-size:12px;color:var(--ink-dim);font-weight:600;white-space:nowrap;margin-left:auto}

  /* ── kpi ── */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
  .kpi{background:rgba(16,21,34,.82);backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:18px;padding:20px;overflow:hidden;
    opacity:0;transform:translateY(16px);animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .kpi:nth-child(1){animation-delay:.04s}
  .kpi:nth-child(2){animation-delay:.08s}
  .kpi:nth-child(3){animation-delay:.12s}
  .kpi:nth-child(4){animation-delay:.16s}
  .kpi:nth-child(5){animation-delay:.2s}
  .kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-dim);
    font-weight:600;margin-bottom:9px}
  .kpi .val{font-size:clamp(20px,3vw,26px);font-weight:700;letter-spacing:-.5px;line-height:1;
    word-break:break-word;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:11.5px;margin-top:7px;color:var(--ink-dim)}

  /* ── заголовки секцій ── */
  .sec-head{display:flex;align-items:center;gap:12px;margin:34px 0 16px}
  .sec-head h2{font-size:17px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
  .sec-head .n{font-size:11px;font-weight:700;color:var(--accent);border:1.5px solid rgba(155,127,232,.35);
    background:rgba(155,127,232,.10);
    border-radius:50%;width:24px;height:24px;display:grid;place-items:center;flex-shrink:0}
  .sec-head .ln{flex:1;height:1px;background:var(--border);min-width:20px}

  .panel{background:rgba(16,21,34,.82);backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);
    padding:22px;margin-bottom:10px;overflow:hidden}

  /* ── стовпчики ── */
  .chart{display:flex;align-items:flex-end;gap:3px;height:180px;padding:10px 0 0;overflow-x:auto}
  .chart .col{flex:1 0 4px;min-width:4px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .chart .barwrap{width:100%;display:flex;align-items:flex-end;justify-content:center;flex:1}
  .chart .bar{width:70%;max-width:22px;background:linear-gradient(180deg,var(--accent),var(--accent-2));
    border-radius:4px 4px 0 0;transition:height .6s cubic-bezier(.2,.8,.2,1);position:relative;min-height:2px}
  .chart .bar:hover{filter:brightness(1.15)}
  .chart .bar:hover::after{content:attr(data-v);position:absolute;top:-26px;left:50%;transform:translateX(-50%);
    background:#1a2033;color:var(--ink);font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;
    white-space:nowrap;z-index:5;border:1px solid var(--border-strong)}

  /* ── воронка ── */
  .funnel-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr minmax(110px,160px);align-items:center;
    gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.04)}
  .funnel-row:last-child{border-bottom:none}
  .funnel-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .funnel-track{height:10px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .funnel-fill{height:100%;border-radius:6px 0 0 6px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .funnel-fill.won{background:linear-gradient(90deg,var(--good),#1CA478)}
  .funnel-fill.lose{background:linear-gradient(90deg,var(--bad),#C0392F)}
  .funnel-nums{font-size:11.5px;color:var(--ink-dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .funnel-nums b{color:var(--ink)}

  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.cols2{grid-template-columns:1fr}}

  .bd-row{display:grid;grid-template-columns:1fr minmax(60px,90px) 34px;align-items:center;gap:8px;
    padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
  .bd-row:last-child{border-bottom:none}
  .bd-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft)}
  .bd-track{height:7px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:99px;overflow:hidden}
  .bd-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .bd-count{text-align:right;font-weight:700}

  .deal-row{display:grid;grid-template-columns:1fr 78px minmax(84px,108px);align-items:center;gap:10px;
    padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12.5px}
  .deal-row:last-child{border-bottom:none}
  .deal-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .deal-sum{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .deal-src{justify-self:end;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:99px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:108px}
  .deal-src.known{background:rgba(155,127,232,.14);color:var(--accent)}
  .deal-src.unknown{background:rgba(255,255,255,.04);color:var(--ink-dim);border:1px dashed var(--border-strong)}
  h2.mini{font-size:12.5px;font-weight:600;margin:0 0 8px}
  .sub-hint{font-size:11.5px;color:var(--ink-dim);margin:-4px 0 10px}

  /* ── таблиці ── */
  table.data-table{width:100%;border-collapse:collapse;font-size:12.5px}
  table.data-table th{text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-dim);
    font-weight:600;padding:11px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.data-table th:first-child{text-align:left}
  table.data-table td{padding:10px;border-bottom:1px solid rgba(255,255,255,.04);text-align:right;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  table.data-table td:first-child{text-align:left;font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  table.data-table tbody tr{transition:background 160ms ease}
  table.data-table tbody tr:hover td{background:rgba(255,255,255,.03)}

  .overdue-badge{display:inline-block;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:99px}
  .overdue-badge.mid{background:var(--mid-bg);color:var(--mid)}
  .overdue-badge.bad{background:var(--bad-bg);color:var(--bad)}
  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-scroll-v{max-height:420px;overflow-y:auto}

  .bucket-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .bucket-tag{font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:99px;
    background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--ink-soft)}
  .bucket-tag b{color:var(--ink)}
  .bucket-tag.warn{background:var(--mid-bg);color:var(--mid);border-color:rgba(255,200,77,.25)}
  .bucket-tag.crit{background:var(--bad-bg);color:var(--bad);border-color:rgba(255,94,108,.25)}

  .flag-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
    border-radius:12px;background:var(--mid-bg);border:1px solid rgba(255,200,77,.20);
    margin-bottom:7px;font-size:12px;color:var(--mid)}
  .flag-item.crit{background:var(--bad-bg);border-color:rgba(255,94,108,.20);color:var(--bad)}
  .flag-item .fl-name{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flag-item .fl-tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;
    background:rgba(255,255,255,.08);white-space:nowrap}

  footer{text-align:center;font-size:11px;color:var(--ink-dim);margin-top:28px}
  footer code{background:rgba(255,255,255,.05);padding:2px 6px;border-radius:5px;color:var(--ink-soft)}
  .err{background:var(--bad-bg);color:var(--bad);border:1px solid rgba(255,94,108,.25);
    padding:14px 18px;border-radius:12px;font-size:13px;margin-bottom:20px}
  .warn-box{background:var(--mid-bg);color:var(--mid);border:1px solid rgba(255,200,77,.25);
    padding:12px 16px;border-radius:12px;font-size:12.5px;margin-bottom:14px}
  .empty-note{color:var(--ink-dim);font-style:italic;font-size:12.5px}
  /* ── картка простроченої задачі (як у списку лідів Bitrix) ── */
  .task-card{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .task-card:last-child{border-bottom:none}
  .task-due{font-size:12.5px;font-weight:600;color:var(--bad)}
  /* підкреслення саме на даті — інакше пунктир тягнеться і на "прострочено N дн." */
  .task-due .dt{text-decoration:underline;text-decoration-style:dashed;text-underline-offset:3px}
  .task-due .ago{color:var(--ink-dim);font-weight:400;margin-left:8px}
  .task-title{font-size:13.5px;margin:5px 0 3px;display:block;color:var(--ink);text-decoration:none}
  a.task-title:hover{color:var(--accent)}
  .task-for{font-size:12px;color:var(--ink-dim)}
  .task-for a{color:var(--accent);text-decoration:none}
  .task-for a:hover{text-decoration:underline}

  .more-btn{margin-top:10px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;
    padding:8px 14px;transition:all 180ms ease;width:100%}
  .more-btn:hover{color:var(--ink);border-color:var(--border-strong)}

  @media(max-width:600px){
    .wrap{padding:24px 16px 48px}
    header{flex-direction:column;align-items:flex-start;gap:10px}
    .meta-line{text-align:left;width:100%}
    .kpis{grid-template-columns:repeat(2,1fr);gap:12px}
    .kpi{padding:16px}
    .kpi .val{font-size:19px}
    .panel{padding:16px}
    .period-cal{width:100%}
    .period-cal input[type=date]{flex:1;max-width:none}
    .period-info{width:100%;margin-left:0}
    .funnel-row{grid-template-columns:1fr;gap:5px}
    .funnel-nums{text-align:left}
    .bd-row{grid-template-columns:1fr 70px 30px}
    .deal-row{grid-template-columns:1fr 60px minmax(64px,84px);gap:6px}
    .sec-head h2{font-size:16px}
  }



  /* ── FAQ: правила роботи ─────────────────────────────────────────────── */
  .faq-head{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
  .faq-head h2{font-size:15px;font-weight:700;letter-spacing:-.3px}
  .faq-count{font-size:11.5px;color:var(--ink-soft);background:rgba(255,255,255,.05);
    border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-weight:600}
  .faq-chev{margin-left:auto;transition:transform .2s;color:var(--ink-dim);font-size:13px}
  .faq-open .faq-chev{transform:rotate(180deg)}
  .faq-body{display:none;margin-top:18px}
  .faq-open .faq-body{display:block}
  .faq-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .faq-search{flex:1 1 240px;padding:10px 14px;font-size:13px;font-family:inherit;
    border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.03);color:var(--ink)}
  .faq-search::placeholder{color:var(--ink-dim)}
  .faq-search:focus{outline:none;border-color:rgba(155,127,232,.45)}
  .btn{padding:10px 16px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;
    border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.03);
    color:var(--ink-soft);transition:all 180ms ease}
  .btn:hover{color:var(--ink);border-color:var(--border-strong)}
  .btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#fff;border-color:transparent}
  .btn-primary:hover{filter:brightness(1.08);color:#fff}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-dim);padding:6px 9px}
  .btn-ghost:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  .faq-item{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;
    background:rgba(255,255,255,.02);transition:border-color 180ms ease}
  .faq-item:hover{border-color:var(--border-strong)}
  .faq-q{display:flex;align-items:flex-start;gap:11px;padding:14px 16px;cursor:pointer}
  .faq-q b{font-size:13.5px;font-weight:600;line-height:1.5;flex:1}
  .faq-mark{color:var(--accent);font-weight:700;font-size:13px;line-height:1.5}
  .faq-a{display:none;padding:0 16px 15px 40px;font-size:13px;color:var(--ink-soft);
    line-height:1.65;white-space:pre-wrap}
  .faq-item.open .faq-a{display:block}
  .faq-meta{display:none;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 16px 13px 40px;border-top:1px solid rgba(255,255,255,.05);
    font-size:11.5px;color:var(--ink-dim)}
  .faq-item.open .faq-meta{display:flex}
  .faq-form{border:1px dashed var(--border-strong);border-radius:14px;padding:16px;
    background:rgba(255,255,255,.02);margin-bottom:16px;display:none}
  .faq-form.show{display:block}
  .faq-form label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.9px;
    color:var(--ink-dim);font-weight:600;margin:0 0 6px}
  .faq-form input,.faq-form textarea,.faq-form select{width:100%;padding:10px 13px;font-size:13px;
    font-family:inherit;border:1px solid var(--border);border-radius:11px;
    background:rgba(255,255,255,.03);color:var(--ink);margin-bottom:13px;resize:vertical}
  .faq-form input::placeholder,.faq-form textarea::placeholder{color:var(--ink-dim)}
  .faq-form input:focus,.faq-form textarea:focus,.faq-form select:focus{
    outline:none;border-color:rgba(155,127,232,.45)}
  .faq-form textarea{min-height:92px;line-height:1.6}
  .faq-form select option{background:#101522;color:var(--ink)}
  .faq-actions{display:flex;gap:9px;flex-wrap:wrap}
  .faq-note{font-size:12px;color:var(--mid);background:var(--mid-bg);
    border:1px solid rgba(255,200,77,.22);border-radius:11px;
    padding:11px 14px;margin-bottom:15px;line-height:1.55}
  .faq-empty{font-size:13px;color:var(--ink-dim);padding:16px 2px}
  .faq-confirm{font-size:11.5px;color:var(--bad)}
  /* Єдина кнопка в бічній смузі — інструмент для менеджера. Навігації по
     дашборду тут немає свідомо: сторінкою користується команда. */
  .sidebar{padding-top:40px}
  .sidebar a.tool{color:#FFC84D;background:rgba(255,200,77,.12);border-color:rgba(255,200,77,.28)}
  .sidebar a.tool:hover{color:#FFD97A;background:rgba(255,200,77,.2);border-color:rgba(255,200,77,.45)}
</style>
</head>
<body>

<div class="bg-fx">
  <div class="glow-1"></div><div class="glow-2"></div><div class="glow-3"></div>
  <div class="grid"></div><div class="horizon"></div>
</div>

<div class="layout">
<nav class="sidebar">
  <a href="https://olexiipoliakov.github.io/mattress-selector/" target="_blank" rel="noopener" class="tool">
    <i data-lucide="bed-double"></i><span class="tip">Підбір матраца</span></a>
</nav>

<div class="wrap">
  <header>
    <div>
      <div class="page-title">
        <span class="ti"><i data-lucide="users"></i></span>
        Менеджери
      </div>
      <div class="sub">Bitrix24 · конверсія лід→угода</div>
    </div>
    <div class="meta-line">Дані з: <b id="period-from">—</b><br>Оновлено: <b id="updated">—</b></div>
  </header>

  <div id="error-box"></div>

  <div class="period-bar">
    <div class="period-btns">
      <button class="pbtn" onclick="setPeriodDays(0,this)">Сьогодні</button>
      <button class="pbtn" onclick="setPeriodDays(1,this)">Вчора</button>
      <button class="pbtn" data-days="7" onclick="setPeriod(7,this)">7 днів</button>
      <button class="pbtn" data-days="14" onclick="setPeriod(14,this)">14 днів</button>
      <button class="pbtn active" data-days="30" onclick="setPeriod(30,this)">30 днів</button>
      <button class="pbtn" data-days="90" onclick="setPeriod(90,this)">Всі</button>
    </div>
    <div class="period-cal">
      <span>або період:</span>
      <input type="date" id="date-from" onchange="setCustom()">
      <span>—</span>
      <input type="date" id="date-to" onchange="setCustom()">
    </div>
    <div class="period-info" id="period-info">—</div>
  </div>

  <div class="panel">
    <div class="table-scroll"><table class="data-table" id="manager-table"></table></div>
  </div>

  <div class="panel" id="faq-panel">
    <div class="faq-head" onclick="toggleFaq()">
      <h2>Правила роботи</h2>
      <span class="faq-count" id="faq-count">—</span>
      <span class="faq-chev">▼</span>
    </div>
    <div class="faq-body">
      <div id="faq-note"></div>
      <div class="faq-tools">
        <input class="faq-search" id="faq-search" type="search"
               placeholder="Пошук за питанням або відповіддю…" oninput="renderFaq()">
        <button class="btn btn-primary" onclick="toggleFaqForm()">Додати правило</button>
      </div>
      <div class="faq-form" id="faq-form">
        <label for="faq-author">Хто додає</label>
        <select id="faq-author"></select>
        <label for="faq-question">Питання</label>
        <input id="faq-question" type="text" maxlength="300"
               placeholder="Наприклад: що робити, якщо клієнт просить знижку понад 10%?">
        <label for="faq-answer">Відповідь</label>
        <textarea id="faq-answer" maxlength="4000"
                  placeholder="Коротко й по суті: що саме робити, з ким погоджувати, де фіксувати."></textarea>
        <div class="faq-actions">
          <button class="btn btn-primary" id="faq-save" onclick="saveFaq()">Зберегти</button>
          <button class="btn" onclick="toggleFaqForm(false)">Скасувати</button>
          <span id="faq-form-msg" style="font-size:12px;color:var(--danger);align-self:center"></span>
        </div>
      </div>
      <div id="faq-list"></div>
    </div>
  </div>

  <footer>Данные из <code>bitrix_data.json</code> · Bitrix24 REST API</footer>
</div>
</div>

<script>
function icons(){ try{ if(window.lucide) lucide.createIcons(); }catch(e){} }
icons();


const fmt=n=>new Intl.NumberFormat('uk-UA').format(Math.round(n||0));
const fmt1=n=>new Intl.NumberFormat('uk-UA',{minimumFractionDigits:1,maximumFractionDigits:1}).format(n||0);
const fmtDate=iso=>{ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; };

let RAW=null, META={stages:{},lead_statuses:{},lead_sources:{},users:{}};
let curFrom=null, curTo=null;

async function load(){
  try{
    const res=await fetch('bitrix_data.json?_='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    RAW=await res.json();
    if(!Array.isArray(RAW.deals) || !Array.isArray(RAW.leads)){
      showError('Формат bitrix_data.json застарів (старий агрегований формат) — дочекайтесь наступного успішного запуску fetch_bitrix.py, після якого дані стануть "сирими" і сторінка запрацює.');
      return;
    }
    META = RAW.meta || META;
    fillAuthors();
    document.getElementById('updated').textContent = RAW.generated_at || '—';
    document.getElementById('period-from').textContent = RAW.period_from ? fmtDate(RAW.period_from) : '—';
    setPeriod(30, document.querySelector('.pbtn[data-days="30"]'));
  }catch(e){
    showError('Не удалось загрузить bitrix_data.json: '+e.message);
  }
}
function showError(msg){ document.getElementById('error-box').innerHTML=`<div class="err">${msg}</div>`; }

function allDates(){
  const deals=(RAW&&RAW.deals)||[], leads=(RAW&&RAW.leads)||[];
  return [...new Set([...deals.map(d=>d.date),...leads.map(l=>l.date)].filter(Boolean))].sort();
}

function setPeriod(days,btn){
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const dates=allDates();
  if(!dates.length){ curFrom=curTo=null; applyFilter(); return; }
  const todayIso=new Date().toISOString().slice(0,10);
  const maxD=dates[dates.length-1];
  const toIso = todayIso<=maxD ? todayIso : maxD;
  const to=new Date(toIso+'T00:00:00');
  const from=new Date(to); from.setDate(from.getDate()-(days-1));
  const fromIso=from.toISOString().slice(0,10);
  curFrom = fromIso<dates[0] ? dates[0] : fromIso;
  curTo = toIso;
  document.getElementById('date-from').value=curFrom;
  document.getElementById('date-to').value=curTo;
  applyFilter();
}
function setPeriodDays(daysAgo, btn){
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const dates=allDates();
  if(!dates.length){ curFrom=curTo=null; applyFilter(); return; }
  const today=new Date(); today.setDate(today.getDate()-daysAgo);
  const iso=today.toISOString().slice(0,10);
  const minD=dates[0], maxD=dates[dates.length-1];
  const clamped = iso<minD?minD:(iso>maxD?maxD:iso);
  curFrom=clamped; curTo=clamped;
  document.getElementById('date-from').value=curFrom;
  document.getElementById('date-to').value=curTo;
  applyFilter();
}
function setCustom(){
  const f=document.getElementById('date-from').value;
  const t=document.getElementById('date-to').value;
  if(f&&t&&f>t) return;
  curFrom=f||null; curTo=t||null;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('active'));
  applyFilter();
}

function applyFilter(){
  if(!RAW) return;
  const deals=(RAW.deals||[]).filter(d=>(!curFrom||d.date>=curFrom)&&(!curTo||d.date<=curTo));
  const leads=(RAW.leads||[]).filter(l=>(!curFrom||l.date>=curFrom)&&(!curTo||l.date<=curTo));
  const info=document.getElementById('period-info');
  const dd=new Set([...deals.map(d=>d.date),...leads.map(l=>l.date)]).size;
  info.textContent = curFrom||curTo ? `${fmtDate(curFrom)} — ${fmtDate(curTo)} · ${dd} дн.` : 'весь період';
  render(deals, leads);
}

function stageMeta(id){
  const raw = (META.stages&&META.stages[id]) || {name:id||'(без стадії)', semantics:''};
  let sem = raw.semantics;
  if(!sem){
    if(/WON/i.test(id)) sem='S';
    else if(/LOSE|FAIL|LOSS/i.test(id)) sem='F';
  }
  return {...raw, semantics: sem};
}
function managerName(id){ return (META.users&&META.users[id]) || (id ? 'ID '+id : '(не призначено)'); }
function round1(n){ return Math.round(n*10)/10; }

function aggregateManagers(deals, leads){
  const byManager={};
  deals.forEach(d=>{
    const st=stageMeta(d.stage_id);
    const mgr=d.manager_id||'';
    if(!byManager[mgr]) byManager[mgr]={manager_id:mgr,name:managerName(mgr),deals:0,dealsSum:0,leads:0,leadsRejected:0};
    byManager[mgr].deals++; byManager[mgr].dealsSum+=d.amount;
  });
  leads.forEach(l=>{
    const mgr=l.manager_id||'';
    if(!byManager[mgr]) byManager[mgr]={manager_id:mgr,name:managerName(mgr),deals:0,dealsSum:0,leads:0,leadsRejected:0};
    byManager[mgr].leads++;
    if(l.semantic==='F') byManager[mgr].leadsRejected++;
  });
  return byManager;
}

function render(dealsRaw, leadsRaw){
  const byManager=aggregateManagers(dealsRaw, leadsRaw);
  renderManagers(byManager);
}

function renderManagers(byManager){
  const table=document.getElementById('manager-table');
  const rows=Object.values(byManager).sort((a,b)=>b.dealsSum-a.dealsSum);
  if(!rows.length){ table.innerHTML=`<tr><td class="empty-note">Немає даних за цей період.</td></tr>`; return; }
  const head=`<thead><tr><th>Менеджер</th><th>Угод</th><th>Сума угод</th><th>Лідів</th><th>Забраковано лідів</th><th>Конверсія лід→угода</th></tr></thead>`;
  const body=rows.map(m=>{
    const rate = m.leads ? round1(m.deals/m.leads*100) : 0;
    return `<tr>
    <td>${m.name}</td><td>${fmt(m.deals)}</td><td>${fmt(m.dealsSum)} грн</td>
    <td>${fmt(m.leads)}</td><td style="color:var(--bad)">${fmt(m.leadsRejected)}</td>
    <td><b>${fmt1(rate)}%</b></td>
  </tr>`;
  }).join('');
  table.innerHTML=head+`<tbody>${body}</tbody>`;
}


// ── FAQ: правила роботи ───────────────────────────────────────────────────
// Записи зберігає сервер (див. faq_store.py). Сторінка лише показує їх і
// відправляє нові — щоб правило, додане одним менеджером, бачили всі, а не
// тільки той браузер, у якому його набрали.
let FAQ = [], FAQ_STORAGE = '', FAQ_EDIT = null;

function toggleFaq(force){
  const p = document.getElementById('faq-panel');
  const open = (force === undefined) ? !p.classList.contains('faq-open') : force;
  p.classList.toggle('faq-open', open);
  try{ localStorage.setItem('faqOpen', open ? '1' : '0'); }catch(e){}
}

function toggleFaqForm(force){
  const f = document.getElementById('faq-form');
  const show = (force === undefined) ? !f.classList.contains('show') : force;
  f.classList.toggle('show', show);
  document.getElementById('faq-form-msg').textContent = '';
  if(!show){ FAQ_EDIT = null; document.getElementById('faq-save').textContent = 'Зберегти'; }
}

function fillAuthors(){
  const cur = document.getElementById('faq-author');
  const names = Object.values((META && META.users) || {}).filter(Boolean)
                      .sort((a,b)=>a.localeCompare(b,'uk'));
  const prev = (()=>{ try{ return localStorage.getItem('faqAuthor')||''; }catch(e){ return ''; } })();
  const val = cur ? cur.value : '';
  if(names.length){
    const sel = document.createElement('select');
    sel.id = 'faq-author';
    sel.innerHTML = names.map(n=>`<option${n===(val||prev)?' selected':''}>${esc(n)}</option>`).join('');
    cur.replaceWith(sel);
  }else if(cur && cur.tagName === 'SELECT'){
    // Імена не приїхали — не блокуємо додавання правила, даємо вписати руками.
    const inp = document.createElement('input');
    inp.id = 'faq-author'; inp.type = 'text'; inp.placeholder = 'Ваше імʼя';
    inp.value = val || prev;
    cur.replaceWith(inp);
  }
}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadFaq(){
  try{
    const r = await fetch('api/faq', {headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    FAQ = d.items || [];
    FAQ_STORAGE = d.storage || '';
    const note = document.getElementById('faq-note');
    // Поки таблиця не підключена, записи лежать на диску Render і зникнуть
    // при передеплої. Чесно попереджаємо, щоб ніхто не вважав це архівом.
    note.innerHTML = (FAQ_STORAGE === 'sheet') ? '' :
      `<div class="faq-note">Сховище ще не підключене — записи тимчасові й зникнуть
       при оновленні дашборда. ${esc(d.detail||'')}</div>`;
  }catch(e){
    console.error('[FAQ]', e);
    document.getElementById('faq-note').innerHTML =
      `<div class="faq-note">Не вдалося завантажити правила: ${esc(e.message||e)}</div>`;
  }
  renderFaq();
}

function renderFaq(){
  const q = (document.getElementById('faq-search').value || '').trim().toLowerCase();
  const list = document.getElementById('faq-list');
  document.getElementById('faq-count').textContent = FAQ.length ? `${FAQ.length}` : '0';
  const rows = q ? FAQ.filter(i =>
      (i.question||'').toLowerCase().includes(q) || (i.answer||'').toLowerCase().includes(q)) : FAQ;
  if(!rows.length){
    list.innerHTML = `<div class="faq-empty">${FAQ.length
      ? 'За цим запитом нічого не знайшлось.'
      : 'Правил поки немає. Додайте перше — воно буде видно всій команді.'}</div>`;
    return;
  }
  list.innerHTML = rows.map(i => `
    <div class="faq-item" id="faq-${esc(i.id)}">
      <div class="faq-q" onclick="this.parentNode.classList.toggle('open')">
        <span class="faq-mark">?</span><b>${esc(i.question)}</b>
      </div>
      <div class="faq-a">${esc(i.answer)}</div>
      <div class="faq-meta">
        <span>${esc(i.author||'—')} · ${esc(i.updated_at||i.created_at||'')}</span>
        <button class="btn btn-ghost" onclick="editFaq('${esc(i.id)}')">Змінити</button>
        <button class="btn btn-ghost" onclick="askDeleteFaq('${esc(i.id)}',this)">Видалити</button>
      </div>
    </div>`).join('');
}

function editFaq(id){
  const it = FAQ.find(x=>x.id===id); if(!it) return;
  FAQ_EDIT = id;
  document.getElementById('faq-question').value = it.question || '';
  document.getElementById('faq-answer').value = it.answer || '';
  const sel = document.getElementById('faq-author');
  if(it.author && [...sel.options].some(o=>o.value===it.author || o.text===it.author)) sel.value = it.author;
  document.getElementById('faq-save').textContent = 'Зберегти зміни';
  toggleFaqForm(true);
  document.getElementById('faq-question').focus();
}

// Своє підтвердження, а не confirm(): системне вікно блокує сторінку і
// виглядає чужорідно на дашборді.
function askDeleteFaq(id, btn){
  const box = btn.parentNode;
  if(box.querySelector('.faq-confirm')) return;
  const span = document.createElement('span');
  span.className = 'faq-confirm';
  span.innerHTML = `Видалити? <button class="btn btn-ghost" style="color:var(--bad)">Так</button>
                    <button class="btn btn-ghost">Ні</button>`;
  const [yes, no] = span.querySelectorAll('button');
  yes.onclick = () => doDeleteFaq(id);
  no.onclick = () => span.remove();
  box.appendChild(span);
}

async function doDeleteFaq(id){
  try{
    const r = await fetch('api/faq/'+encodeURIComponent(id), {method:'DELETE'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    FAQ = FAQ.filter(x=>x.id!==id);
    renderFaq();
  }catch(e){ console.error('[FAQ delete]', e); alertFaq('Не вдалося видалити: '+(e.message||e)); }
}

function alertFaq(msg){ document.getElementById('faq-form-msg').textContent = msg; }

async function saveFaq(){
  const author = document.getElementById('faq-author').value || '';
  const question = document.getElementById('faq-question').value.trim();
  const answer = document.getElementById('faq-answer').value.trim();
  if(!question || !answer){ alertFaq('Заповніть питання і відповідь.'); return; }
  const btn = document.getElementById('faq-save');
  btn.disabled = true;
  try{
    try{ localStorage.setItem('faqAuthor', author); }catch(e){}
    const editing = FAQ_EDIT;
    const r = await fetch(editing ? 'api/faq/'+encodeURIComponent(editing) : 'api/faq', {
      method: editing ? 'PUT' : 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({author, question, answer}),
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
    if(editing){
      const i = FAQ.findIndex(x=>x.id===editing);
      if(i>=0) FAQ[i] = d.item;
    }else{
      FAQ.unshift(d.item);
      if(d.storage) FAQ_STORAGE = d.storage;
    }
    document.getElementById('faq-question').value = '';
    document.getElementById('faq-answer').value = '';
    toggleFaqForm(false);
    renderFaq();
  }catch(e){
    console.error('[FAQ save]', e);
    alertFaq('Не вдалося зберегти: ' + (e.message || e));
  }finally{ btn.disabled = false; }
}

function initFaq(){
  fillAuthors();
  let open = false;
  try{ open = localStorage.getItem('faqOpen') === '1'; }catch(e){}
  toggleFaq(open);
  loadFaq();
}

load();
initFaq();

</script>
</body>
</html>
